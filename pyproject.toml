[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["replay_cdxj_indexing_tools*"]

[tool.setuptools.package-data]
replay_cdxj_indexing_tools = ["*.sh"]

[project]
name = "replay-cdxj-indexing-tools"
version = "1.6.0"
description = "Tools for web archive replay CDXJ indexing like parallel indexing, merging large CDXJ files, and converting to ZipNum format"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Arquivo.pt Team", email = "contacto@arquivo.pt"}
]
keywords = ["cdxj", "web-archive", "indexing", "pywb", "warc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pywb>=2.9.1",
    "surt>=0.3.1", # It should be the same version of pywb, but we depend on it directly.
    "redis==2.10.6", # It should be the same version of pywb, but we depend on it directly.
    # 5.3.0 is the floor: the domain-etld1 sink uses ExtractResult.top_domain_under_public_suffix,
    # which was only added in 5.3.0 (earlier 5.x releases only have the now-deprecated
    # registered_domain). Already pulled in transitively by surt/pywb, but we depend on it directly.
    "tldextract>=5.3.0",
]

[project.optional-dependencies]
# Reading indexes from http(s):// locations (see replay_cdxj_indexing_tools/storage.py)
http = [
    "fsspec>=2023.1.0",
    "aiohttp>=3.8",
]
# Reading indexes from s3:// locations (S3-compatible object storage)
s3 = [
    "fsspec>=2023.1.0",
    "s3fs>=2023.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "pylint>=3.0",
    "mypy>=1.0",
    "types-redis",
    "isort>=5.0",
    "autoflake>=2.0",
    # Remote extras, plus a local S3 server for their tests
    "replay-cdxj-indexing-tools[http,s3]",
    "moto[server]>=5.0",
]

[project.urls]
Homepage = "https://github.com/arquivo/replay-cdxj-indexing-tools"
Repository = "https://github.com/arquivo/replay-cdxj-indexing-tools"
Issues = "https://github.com/arquivo/replay-cdxj-indexing-tools/issues"

[project.scripts]
merge-flat-cdxj = "replay_cdxj_indexing_tools.merge.merge_flat_cdxj:main"
flat-cdxj-to-zipnum = "replay_cdxj_indexing_tools.zipnum.flat_cdxj_to_zipnum:main"
zipnum-to-flat-cdxj = "replay_cdxj_indexing_tools.zipnum.zipnum_to_flat_cdxj:main"
filter-excessive-urls = "replay_cdxj_indexing_tools.filter.excessive_urls:main"
filter-blocklist = "replay_cdxj_indexing_tools.filter.blocklist:main"
addfield-to-flat-cdxj = "replay_cdxj_indexing_tools.addfield.addfield_to_flat_cdxj:main"
cdxj-index-collection = "replay_cdxj_indexing_tools.process_collection_wrapper:main"
arclist-to-path-index = "replay_cdxj_indexing_tools.arclist_to_path_index:main"
path-index-to-redis = "replay_cdxj_indexing_tools.redis.path_index_to_redis:main"
arclist-index-to-redis = "replay_cdxj_indexing_tools.arclist_index_to_redis:main"
cdxj-search = "replay_cdxj_indexing_tools.search.cdxj_search:main"
cdxj-extract-field = "replay_cdxj_indexing_tools.search.extract_field:main"
cdxj-stats = "replay_cdxj_indexing_tools.stats.cdxj_stats:main"
cdxj-to-csv = "replay_cdxj_indexing_tools.export.cdxj_to_csv:main"

[project.entry-points."replay_cdxj_indexing_tools.sinks"]
mimetype = "replay_cdxj_indexing_tools.stats.sinks.mimetype:MimetypeSink"
domain-host = "replay_cdxj_indexing_tools.stats.sinks.domain:DomainHostSink"
domain-etld1 = "replay_cdxj_indexing_tools.stats.sinks.domain:DomainEtld1Sink"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["replay_cdxj_indexing_tools"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
per-file-ignores = [
    "tests/*:E501",
]

[tool.pylint.messages_control]
max-line-length = 100
disable = ["C0111", "R0913", "R0914"]

[tool.mypy]
files = ["replay_cdxj_indexing_tools"]

[[tool.mypy.overrides]]
module = ["pywb.*", "surt.*", "tldextract.*", "fsspec.*", "s3fs.*", "moto.*"]
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version} [skip ci]"
upload_to_release = true
